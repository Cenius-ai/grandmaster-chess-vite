<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#110a09" />
  <meta name="description" content="Play chess against a grandmaster-level computer opponent." />
  <title>HTML2 Chess — Grandmaster Challenge</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='28' font-size='28'%3E♟%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Loading state -->
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading chess engine…</p>
    </div>

    <!-- Main game layout -->
    <div id="game-screen" class="game-screen hidden" role="main" aria-label="Chess game">
      <!-- Status bar — HUD top strip -->
      <div id="status-bar" class="status-bar" role="status" aria-live="assertive" aria-atomic="true"></div>

      <!-- Arena: board center + side panel -->
      <div class="arena">
        <!-- Chessboard container -->
        <div class="board-container">
          <div id="chessboard" class="chessboard" role="grid" aria-label="Chess board">
            <!-- Generated by board.js -->
          </div>
          <div class="board-coords board-coords--files" aria-hidden="true">
            <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
          </div>
        </div>

        <!-- Side panel — HUD corner cluster -->
        <aside id="side-panel" class="side-panel" aria-label="Game information">
          <div class="panel-header">
            <h2 class="panel-title">Game Info</h2>
            <button id="panel-toggle" class="panel-toggle" aria-label="Toggle side panel" title="Toggle panel">☰</button>
          </div>

          <div class="panel-section">
            <h3 class="section-title">Status</h3>
            <div id="status-message" class="status-message" aria-live="polite"></div>
          </div>

          <div class="panel-section">
            <h3 class="section-title">Controls</h3>
            <div id="controls" class="controls"></div>
          </div>

          <div class="panel-section panel-section--grow">
            <h3 class="section-title">Move History</h3>
            <div id="move-list" class="move-list" role="log" aria-label="Move history" aria-live="polite">
              <p class="move-list-empty">No moves yet. Your move as White.</p>
            </div>
          </div>

          <div class="panel-section">
            <div id="engine-status" class="engine-status" aria-live="polite">
              Engine: <span class="engine-indicator engine-indicator--loading">initializing…</span>
            </div>
          </div>
        </aside>
      </div>

      <!-- Keyboard help — centered modal -->
      <div id="keyboard-help" class="keyboard-help hidden" role="dialog" aria-label="Keyboard shortcuts">
        <h3>Keyboard Controls</h3>
        <ul>
          <li><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Navigate squares</li>
          <li><kbd>Enter</kbd> Select piece / Confirm move</li>
          <li><kbd>Escape</kbd> Deselect / Cancel</li>
          <li><kbd>N</kbd> New game</li>
          <li><kbd>U</kbd> Undo move</li>
          <li><kbd>?</kbd> Toggle this help</li>
        </ul>
        <button id="keyboard-help-close" class="btn btn--small">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
